<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Оқушы кабинеті | AI-BILIM</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #0f172a;
    }

    /* HEADER */

    header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
    }

    .logout-btn {
      border: none;
      background: #fff1f2;
      color: #be123c;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: #ffe4e6;
    }

    /* MAIN */

    main {
      width: min(1180px, 92%);
      margin: 45px auto;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 38px;
    }

    .welcome p {
      margin: 0;
      color: #64748b;
      font-size: 17px;
    }

    /* STAT CARDS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
    }

    .stat-icon {
      font-size: 28px;
      margin-bottom: 14px;
    }

    .stat-number {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #64748b;
    }

    /* JOIN CLASS */

    .join-card {
      background: linear-gradient(135deg, #ffffff, #f0fdf9);
      border: 1px solid #d8e8df;
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
    }

    .join-card h2 {
      margin-top: 0;
      font-size: 26px;
    }

    .join-card p {
      color: #64748b;
    }

    .join-form {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .join-form input {
      flex: 1;
      padding: 16px 18px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      font-size: 18px;
      text-transform: uppercase;
      outline: none;
    }

    .join-form input:focus {
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
    }

    .join-btn {
      border: none;
      background: #059669;
      color: white;
      padding: 16px 25px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .join-btn:hover {
      background: #047857;
    }

    .join-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* MESSAGE */

    #message {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 600;
    }

    #message.success {
      display: block;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    #message.error {
      display: block;
      background: #fff1f2;
      color: #be123c;
      border: 1px solid #fecdd3;
    }

    /* CLASSES */

    .section-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
    }

    .section-card h2 {
      margin-top: 0;
      font-size: 27px;
    }

    .classes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .class-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #ffffff, #fffaf2);
      border: 1px solid #eadfce;
      border-radius: 20px;
      padding: 24px;
      transition: 0.2s ease;
    }

    .class-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
      background: linear-gradient(#d97706, #059669);
    }

    .class-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    .class-card h3 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    .subject {
      display: inline-block;
      background: #fff3d6;
      color: #92400e;
      padding: 9px 13px;
      border-radius: 12px;
      font-weight: 700;
    }

    .class-code {
      margin-top: 18px;
      padding: 12px;
      background: #f0fdfa;
      border-radius: 12px;
      color: #0f766e;
      font-weight: 700;
    }

    .open-class {
      margin-top: 18px;
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 12px;
      background: #0f8f76;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      background: #f8fafc;
      border-radius: 18px;
      color: #64748b;
    }

    @media (max-width: 760px) {

      header {
        padding: 18px 4%;
      }

      main {
        width: 94%;
        margin: 28px auto;
      }

      .welcome h1 {
        font-size: 30px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .join-form {
        flex-direction: column;
      }

      .join-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">AI-BILIM</div>

  <button
    class="logout-btn"
    id="logoutBtn"
    type="button"
  >
    Шығу
  </button>
</header>

<main>

  <section class="welcome">

    <h1>🎓 Оқушы кабинеті</h1>

    <p id="welcome">
      Қош келдіңіз!
    </p>

  </section>


  <section class="stats">

    <div class="stat-card">
      <div class="stat-icon">🏫</div>
      <div class="stat-number" id="classCount">0</div>
      <div class="stat-label">Менің сыныптарым</div>
    </div>

    <div class="stat-card">
      <div class="stat-icon">📝</div>
      <div class="stat-number">0</div>
      <div class="stat-label">Тапсырмалар</div>
    </div>

    <div class="stat-card">
      <div class="stat-icon">📊</div>
      <div class="stat-number">—</div>
      <div class="stat-label">Орташа нәтиже</div>
    </div>

  </section>


  <section class="join-card">

    <h2>🔑 Сыныпқа қосылу</h2>

    <p>
      Мұғалім берген қосылу кодын енгізіңіз.
    </p>

    <div class="join-form">

      <input
        type="text"
        id="classCode"
        placeholder="Мысалы: YBU-8269"
        maxlength="20"
        autocomplete="off"
      >

      <button
        class="join-btn"
        id="joinBtn"
        type="button"
      >
        Сыныпқа қосылу
      </button>

    </div>

    <div id="message"></div>

  </section>


  <section class="section-card">

    <h2>🏫 Менің сыныптарым</h2>

    <div
      id="classes"
      class="classes"
    >
      <div class="empty">
        Сыныптар жүктелуде...
      </div>
    </div>

  </section>
<!-- ОҚУШЫ ТАПСЫРМАЛАРЫ -->
<section style="margin-top:25px;">

    <h2>📝 Менің тапсырмаларым</h2>

    <div id="studentAssignments">
        <div class="empty">
            Тапсырмалар жүктелуде...
        </div>
    </div>

</section>
</main>


<!-- Біздің Supabase конфигурациямыз -->
<script src="../js/config.js"></script>

<script>

let currentUser = null;
async function loadStudentAssignments() {

    const container =
        document.getElementById("studentAssignments");

    if (!container) return;

    try {

        // Қазіргі оқушы
        const {
            data: { user },
            error: userError
        } = await sb.auth.getUser();

        if (userError || !user) {
            throw new Error("Оқушы анықталмады");
        }

        // Оқушы кірген сыныптарды анықтау
        const { data: memberships, error: memberError } = await sb
            .from("class_members")
            .select("class_id")
            .eq("student_id", user.id);

        if (memberError) throw memberError;

        if (!memberships || memberships.length === 0) {
            container.innerHTML =
                `<div class="empty">
                    Сіз әлі сыныпқа қосылмағансыз.
                 </div>`;
            return;
        }

        const classIds =
            memberships.map(item => item.class_id);

        // Жарияланған тапсырмаларды алу
        const { data: assignments, error: assignmentError } =
            await sb
                .from("assignments")
                .select("*")
                .in("class_id", classIds)
                .eq("is_published", true)
                .order("created_at", {
                    ascending: false
                });

        if (assignmentError) throw assignmentError;

        if (!assignments || assignments.length === 0) {

            container.innerHTML =
                `<div class="empty">
                    Әзірге жаңа тапсырма жоқ.
                 </div>`;

            return;
        }

        container.innerHTML = "";

        assignments.forEach(task => {

            const card = document.createElement("div");

            card.style.cssText = `
                background:white;
                border:1px solid #e2e8f0;
                border-radius:16px;
                padding:20px;
                margin-top:12px;
                box-shadow:0 5px 18px rgba(15,23,42,.06);
            `;

            const dueDate = task.due_date
                ? new Date(task.due_date)
                    .toLocaleString("kk-KZ")
                : "Мерзімі көрсетілмеген";

            card.innerHTML = `
                <div style="
                    font-size:20px;
                    font-weight:800;
                    color:#0f172a;
                ">
                    📝 ${escapeAssignment(task.title)}
                </div>

                <div style="
                    margin-top:8px;
                    color:#475569;
                ">
                    ${escapeAssignment(
                        task.description ||
                        "Сипаттама жоқ"
                    )}
                </div>

                <div style="
                    display:flex;
                    gap:10px;
                    flex-wrap:wrap;
                    margin-top:15px;
                ">

                    <span style="
                        background:#eef2ff;
                        padding:7px 12px;
                        border-radius:20px;
                        font-weight:700;
                    ">
                        ⭐ ${task.max_score || 10} балл
                    </span>

                    <span style="
                        background:#f0fdf4;
                        padding:7px 12px;
                        border-radius:20px;
                    ">
                        📅 ${dueDate}
                    </span>

                </div>
            `;
// Деңгейлік интерактивті тапсырма болса
if (task.activity_type === "level" && task.activity_data) {

    const actionBox = document.createElement("div");

    actionBox.style.cssText = `
        margin-top:16px;
        padding-top:16px;
        border-top:1px solid #e2e8f0;
    `;

    actionBox.innerHTML = `
        <div style="
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
            flex-wrap:wrap;
        ">

            <div>
                <div style="
                    font-weight:700;
                    color:#0f172a;
                    margin-bottom:4px;
                ">
                    🧠 Интерактивті деңгейлік тапсырма
                </div>

                <div style="
                    font-size:13px;
                    color:#64748b;
                ">
                    A → B → C деңгейлері •
                    ${(task.activity_data.questions || []).length} тапсырма
                </div>
            </div>

            <button
                type="button"
                style="
                    border:none;
                    background:#0f766e;
                    color:white;
                    padding:11px 20px;
                    border-radius:10px;
                    font-weight:700;
                    cursor:pointer;
                "
            >
                ▶ Орындау
            </button>

        </div>
    `;

    const startBtn = actionBox.querySelector("button");

    startBtn.addEventListener("click", () => {
        openStudentLevelTask(task);
    });

    card.appendChild(actionBox);
}
            container.appendChild(card);
        });

    } catch (error) {

        console.error("Тапсырмалар қатесі:", error);

        container.innerHTML =
            `<div class="empty">
                ❌ Тапсырмаларды жүктеу мүмкін болмады.
             </div>`;
    }
}

function openStudentLevelTask(task) {

    const activity = task.activity_data;

    if (!activity || !Array.isArray(activity.questions)) {
        alert("Тапсырма мәліметтері табылмады.");
        return;
    }

    // Бұрын ашылған терезе болса өшіреміз
    const oldModal = document.getElementById("studentTaskModal");
    if (oldModal) oldModal.remove();

    const modal = document.createElement("div");
    modal.id = "studentTaskModal";

    modal.style.cssText = `
        position:fixed;
        inset:0;
        background:rgba(15,23,42,.72);
        z-index:99999;
        overflow-y:auto;
        padding:25px;
    `;

    let questionsHTML = "";

    ["A", "B", "C"].forEach(level => {

        const levelQuestions =
            activity.questions.filter(q => q.level === level);

        if (!levelQuestions.length) return;

        const levelName =
            level === "A"
                ? "A деңгейі — Базалық"
                : level === "B"
                    ? "B деңгейі — Орта"
                    : "C деңгейі — Жоғары";

        questionsHTML += `
            <section style="
                margin:25px 0;
                padding:22px;
                background:#f8fafc;
                border-radius:18px;
                border:1px solid #e2e8f0;
            ">

                <h2 style="margin-top:0;">
                    ${levelName}
                </h2>
        `;

        levelQuestions.forEach((q, index) => {

            const globalIndex =
                activity.questions.indexOf(q);

            questionsHTML += `
                <div style="
                    background:white;
                    border:1px solid #e2e8f0;
                    border-radius:15px;
                    padding:20px;
                    margin:15px 0;
                ">

                    <div style="
                        font-weight:700;
                        font-size:16px;
                        line-height:1.5;
                        margin-bottom:15px;
                    ">
                        ${index + 1}. ${escapeAssignment(q.question)}
                    </div>

                    ${renderStudentAnswer(q, globalIndex)}

                    <div style="
                        margin-top:12px;
                        color:#64748b;
                        font-size:13px;
                    ">
                        ⭐ ${Number(q.points || 0)} ұпай
                    </div>

                </div>
            `;
        });

        questionsHTML += `</section>`;
    });

    modal.innerHTML = `
        <div style="
            max-width:950px;
            margin:20px auto;
            background:white;
            border-radius:24px;
            padding:30px;
            box-shadow:0 25px 80px rgba(0,0,0,.3);
        ">

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:flex-start;
                gap:20px;
            ">

                <div>
                    <div style="
                        color:#0f766e;
                        font-weight:700;
                        margin-bottom:5px;
                    ">
                        🧠 AI-BILIM
                    </div>

                    <h1 style="margin:0 0 8px;">
                        ${escapeAssignment(task.title)}
                    </h1>

                    <p style="
                        margin:0;
                        color:#64748b;
                    ">
                        ${escapeAssignment(
                            activity.instruction ||
                            "Барлық тапсырманы орындаңыз."
                        )}
                    </p>
                </div>

                <button
                    type="button"
                    onclick="closeStudentLevelTask()"
                    style="
                        border:0;
                        background:#f1f5f9;
                        width:42px;
                        height:42px;
                        border-radius:50%;
                        font-size:20px;
                        cursor:pointer;
                    "
                >
                    ✕
                </button>

            </div>

            ${questionsHTML}

            <div style="
                margin-top:25px;
                padding-top:20px;
                border-top:1px solid #e2e8f0;
                display:flex;
                justify-content:flex-end;
            ">

                <button
                    type="button"
                    onclick="submitStudentLevelTask('${task.id}')"
                    style="
                        border:0;
                        background:#0f766e;
                        color:white;
                        padding:14px 25px;
                        border-radius:12px;
                        font-size:16px;
                        font-weight:700;
                        cursor:pointer;
                    "
                >
                    ✅ Жауаптарды жіберу
                </button>

            </div>

        </div>
    `;

    document.body.appendChild(modal);

    window.currentStudentTask = task;
}


function renderStudentAnswer(q, index) {

    // Бір жауапты таңдау
    if (q.type === "choice") {

        return `
            <div style="display:grid;gap:10px;">
                ${(q.options || []).map(option => `
                    <label style="
                        display:flex;
                        align-items:center;
                        gap:10px;
                        padding:12px;
                        border:1px solid #e2e8f0;
                        border-radius:10px;
                        cursor:pointer;
                    ">

                        <input
                            type="radio"
                            name="answer_${index}"
                            value="${escapeAssignment(option)}"
                        >

                        <span>
                            ${escapeAssignment(option)}
                        </span>

                    </label>
                `).join("")}
            </div>
        `;
    }

    // Дұрыс / Бұрыс
    if (q.type === "true_false") {

        return `
            <div style="
                display:flex;
                gap:12px;
                flex-wrap:wrap;
            ">

                <label style="
                    padding:12px 18px;
                    border:1px solid #e2e8f0;
                    border-radius:10px;
                    cursor:pointer;
                ">
                    <input
                        type="radio"
                        name="answer_${index}"
                        value="Дұрыс"
                    >
                    Дұрыс
                </label>

                <label style="
                    padding:12px 18px;
                    border:1px solid #e2e8f0;
                    border-radius:10px;
                    cursor:pointer;
                ">
                    <input
                        type="radio"
                        name="answer_${index}"
                        value="Бұрыс"
                    >
                    Бұрыс
                </label>

            </div>
        `;
    }

    // Жазбаша жауап
    return `
        <textarea
            id="answer_${index}"
            rows="4"
            placeholder="Жауабыңызды жазыңыз..."
            style="
                width:100%;
                box-sizing:border-box;
                padding:13px;
                border:1px solid #cbd5e1;
                border-radius:10px;
                resize:vertical;
                font-family:inherit;
                font-size:15px;
            "
        ></textarea>
    `;
}


function closeStudentLevelTask() {

    const modal =
        document.getElementById("studentTaskModal");

    if (modal) {
        modal.remove();
    }
}
function escapeAssignment(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* ========================================
   ХАБАРЛАМА
======================================== */

function showMessage(text, type = "success") {

  const box = document.getElementById("message");

  box.textContent = text;
  box.className = type;

}


/* ========================================
   ПАРАҚТЫ ІСКЕ ҚОСУ
======================================== */

async function init() {

  try {

    const {
      data: { user },
      error
    } = await sb.auth.getUser();


    if (error || !user) {

      window.location.href = "../login.html";
      return;

    }


    currentUser = user;


    /* Оқушының аты */

    let displayName =
      user.user_metadata?.full_name ||
      user.email ||
      "Оқушы";


    const {
      data: profile,
      error: profileError
    } = await sb
      .from("profiles")
      .select("full_name, role")
      .eq("id", user.id)
      .maybeSingle();


    if (!profileError && profile?.full_name) {
      displayName = profile.full_name;
    }


    document.getElementById("welcome").textContent =
      `Қош келдіңіз, ${displayName}!`;


    await loadMyClasses();

  } catch (err) {

    console.error(err);

    showMessage(
      "Кабинетті жүктеу кезінде қате шықты.",
      "error"
    );

  }

}


/* ========================================
   ОҚУШЫНЫҢ СЫНЫПТАРЫН ЖҮКТЕУ
======================================== */

async function loadMyClasses() {

  const container =
    document.getElementById("classes");


  container.innerHTML =
    `<div class="empty">Сыныптар жүктелуде...</div>`;


  const {
    data: memberships,
    error
  } = await sb
    .from("class_members")
    .select("class_id")
    .eq("student_id", currentUser.id);


  if (error) {

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        Сыныптарды жүктеу кезінде қате шықты.
      </div>`;

    return;

  }


  if (!memberships || memberships.length === 0) {

    document.getElementById("classCount").textContent = "0";

    container.innerHTML =
      `<div class="empty">
        Сіз әзірге ешбір сыныпқа қосылмағансыз.<br><br>
        Мұғалім берген кодты жоғарыдағы өріске енгізіңіз.
      </div>`;

    return;

  }


  const classIds =
    memberships.map(item => item.class_id);


  const {
    data: classes,
    error: classError
  } = await sb
    .from("classes")
    .select("id, name, subject, class_code")
    .in("id", classIds);


  if (classError) {

    console.error(classError);

    container.innerHTML =
      `<div class="empty">
        Сынып мәліметтерін алу мүмкін болмады.
      </div>`;

    return;

  }


  document.getElementById("classCount").textContent =
    classes?.length || 0;


  if (!classes || classes.length === 0) {

    container.innerHTML =
      `<div class="empty">
        Сынып табылмады.
      </div>`;

    return;

  }


  container.innerHTML = "";


  classes.forEach(classItem => {

    const card = document.createElement("div");

    card.className = "class-card";


    const title = document.createElement("h3");

    title.textContent =
      "🏫 " + (classItem.name || "Сынып");


    const subject =
      document.createElement("div");

    subject.className = "subject";

    subject.textContent =
      "📚 " + (classItem.subject || "Пән");


    const code =
      document.createElement("div");

    code.className = "class-code";

    code.textContent =
      "Қосылу коды: " +
      (classItem.class_code || "—");


    const button =
      document.createElement("button");

    button.className = "open-class";

    button.type = "button";

    button.textContent = "Сыныпты ашу →";


    /*
      Келесі кезеңде осы батырманы
      оқушының class.html бетіне қосамыз.
    */

    button.addEventListener("click", () => {

      alert(
        `${classItem.name} сыныбы ашылады.\n\n` +
        `Келесі кезеңде осы жерге тапсырмалар мен ресурстарды қосамыз.`
      );

    });


    card.appendChild(title);
    card.appendChild(subject);
    card.appendChild(code);
    card.appendChild(button);

    container.appendChild(card);

  });

}


/* ========================================
   СЫНЫПҚА ҚОСЫЛУ
======================================== */

async function joinClass() {

  const input =
    document.getElementById("classCode");

  const button =
    document.getElementById("joinBtn");


  const code =
    input.value
      .trim()
      .toUpperCase();


  if (!code) {

    showMessage(
      "Сынып кодын енгізіңіз.",
      "error"
    );

    return;

  }


  button.disabled = true;
  button.textContent = "Тексерілуде...";


  try {

    /*
      Код бойынша сыныпты іздеу
    */

    const {
      data: classItem,
      error: classError
    } = await sb
      .from("classes")
      .select("id, name, subject, class_code")
      .eq("class_code", code)
      .maybeSingle();


    if (classError) {
      throw classError;
    }


    if (!classItem) {

      showMessage(
        "Мұндай қосылу коды табылмады.",
        "error"
      );

      return;

    }


    /*
      Бұрын қосылған ба?
    */

    const {
      data: existing,
      error: existingError
    } = await sb
      .from("class_members")
      .select("id")
      .eq("class_id", classItem.id)
      .eq("student_id", currentUser.id)
      .maybeSingle();


    if (existingError) {
      throw existingError;
    }


    if (existing) {

      showMessage(
        "Сіз бұл сыныпқа бұрын қосылғансыз.",
        "error"
      );

      await loadMyClasses();

      return;

    }


    /*
      class_members кестесіне тіркеу
    */

    const {
      error: insertError
    } = await sb
      .from("class_members")
      .insert({
        class_id: classItem.id,
        student_id: currentUser.id
      });


    if (insertError) {
      throw insertError;
    }


    showMessage(
      `Сәтті! Сіз «${classItem.name}» сыныбына қосылдыңыз.`,
      "success"
    );


    input.value = "";


    await loadMyClasses();


  } catch (err) {

    console.error(err);

    showMessage(
      "Сыныпқа қосылу кезінде қате шықты: " +
      (err.message || "Белгісіз қате"),
      "error"
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "Сыныпқа қосылу";

  }

}


/* ========================================
   БАТЫРМАЛАР
======================================== */

document
  .getElementById("joinBtn")
  .addEventListener(
    "click",
    joinClass
  );


document
  .getElementById("classCode")
  .addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        joinClass();
      }

    }
  );


document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async () => {

      await sb.auth.signOut();

      window.location.href =
        "../login.html";

    }
  );


/* START */

init();
  loadStudentAssignments();

</script>

  <script>
const sosBtn = document.getElementById("sosBtn");
const sosMessage = document.getElementById("sosMessage");

sosBtn.addEventListener("click", async () => {

    const confirmSOS = confirm(
        "🆘 SOS хабарламасын мұғалімге жібересіз бе?"
    );

    if (!confirmSOS) return;

    sosBtn.disabled = true;
    sosBtn.textContent = "Жіберілуде...";

    try {

        // 1. Қазіргі оқушыны анықтау
        const {
            data: { user },
            error: userError
        } = await sb.auth.getUser();

        if (userError || !user) {
            throw new Error("Оқушы аккаунты анықталмады.");
        }

        // 2. Оқушының сыныбын табу
        const { data: membership, error: memberError } = await sb
            .from("class_members")
            .select("class_id")
            .eq("student_id", user.id)
            .limit(1)
            .maybeSingle();

        if (memberError) throw memberError;

        if (!membership) {
            throw new Error("Сіз әлі сыныпқа тіркелмегенсіз.");
        }

        // 3. Сол сыныптың мұғалімін анықтау
        const { data: classData, error: classError } = await sb
            .from("classes")
            .select("id, teacher_id")
            .eq("id", membership.class_id)
            .single();

        if (classError) throw classError;

        if (!classData || !classData.teacher_id) {
            throw new Error("Сынып мұғалімі анықталмады.");
        }

        // 4. SOS хабарламасын сақтау
        const { error: sosError } = await sb
            .from("sos_alerts")
            .insert({
                student_id: user.id,
                class_id: membership.class_id,
                teacher_id: classData.teacher_id,
                message: "Оқушыға шұғыл көмек қажет",
                status: "active"
            });

        if (sosError) throw sosError;

        // 5. Оқушыға нәтиже көрсету
        sosMessage.style.color = "#059669";
        sosMessage.textContent =
            "✅ SOS мұғалімге жіберілді.";

        sosBtn.textContent = "✓ Жіберілді";

        setTimeout(() => {
            sosBtn.disabled = false;
            sosBtn.innerHTML = "🆘<br>SOS";
            sosMessage.textContent = "";
        }, 5000);

    } catch (error) {

        console.error("SOS error:", error);

        sosMessage.style.color = "#dc2626";
        sosMessage.textContent =
            "❌ " + (error.message || "SOS жіберілмеді.");

        sosBtn.disabled = false;
        sosBtn.innerHTML = "🆘<br>SOS";
    }
});
</script>
