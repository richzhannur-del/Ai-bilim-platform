<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Менің сыныптарым | AI-BILIM</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #0f172a;
    }

    header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
    }

    .back {
      text-decoration: none;
      color: #047857;
      font-weight: 700;
    }

    main {
      width: min(1100px, 92%);
      margin: 45px auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 38px;
    }

    .subtitle {
      color: #64748b;
      margin-top: 8px;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .create-btn {
      background: #059669;
      color: white;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: 700;
    }

    .create-btn:hover {
      background: #047857;
    }

    .classes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .class-card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.06);
    }

    .class-card h3 {
      margin-top: 0;
      font-size: 23px;
    }

    .subject {
      color: #64748b;
    }

    .code-box {
      margin-top: 20px;
      background: #ecfdf5;
      padding: 14px;
      border-radius: 12px;
    }

    .code {
      font-size: 22px;
      font-weight: 800;
      color: #047857;
      letter-spacing: 2px;
    }

    .empty {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      color: #64748b;
      grid-column: 1 / -1;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 20px;
      padding: 30px;
    }

    .modal-box h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 25px;
    }

    .cancel-btn {
      padding: 12px 18px;
      border-radius: 10px;
      background: #e2e8f0;
    }

    .save-btn {
      padding: 12px 18px;
      border-radius: 10px;
      background: #059669;
      color: white;
      font-weight: 700;
    }

    #message {
      margin-bottom: 20px;
      font-weight: 700;
    }

    .error {
      color: #dc2626;
    }

    .success {
      color: #059669;
    }

    @media (max-width: 650px) {
      .top {
        flex-direction: column;
        align-items: flex-start;
      }

      h1 {
        font-size: 30px;
      }

      .create-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">AI-BILIM</div>
  <a href="dashboard.html" class="back">← Кабинетке қайту</a>
</header>

<main>

  <div class="top">
    <div>
      <h1>🏫 Менің сыныптарым</h1>
      <div class="subtitle">
        Сынып құрыңыз және оқушыларға қосылу кодын беріңіз.
      </div>
    </div>

    <button class="create-btn" onclick="openModal()">
      + Сынып құру
    </button>
  </div>

  <div id="message"></div>

  <div id="classes" class="classes">
    <div class="empty">Сыныптар жүктелуде...</div>
  </div>

</main>


<div id="modal" class="modal">

  <div class="modal-box">

    <h2>Жаңа сынып</h2>

    <label for="className">Сынып атауы</label>

    <input
      id="className"
      type="text"
      placeholder="Мысалы: 7 А"
    >

    <label for="subject">Пән</label>

    <input
      id="subject"
      type="text"
      placeholder="Мысалы: Информатика"
    >

    <div class="modal-buttons">

      <button
        class="cancel-btn"
        onclick="closeModal()"
      >
        Болдырмау
      </button>

      <button
        id="saveClassBtn"
        class="save-btn"
        onclick="createClass()"
      >
        Сынып құру
      </button>

    </div>

  </div>

</div>


<script src="../js/config.js"></script>

<script>

let currentUser = null;


function openModal() {
  document.getElementById("modal").classList.add("active");
}


function closeModal() {
  document.getElementById("modal").classList.remove("active");
}


function showMessage(text, type = "error") {

  const box = document.getElementById("message");

  box.textContent = text;
  box.className = type;

}


function generateClassCode() {

  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const numbers = "23456789";

  let code = "";

  for (let i = 0; i < 3; i++) {
    code += letters[
      Math.floor(Math.random() * letters.length)
    ];
  }

  code += "-";

  for (let i = 0; i < 4; i++) {
    code += numbers[
      Math.floor(Math.random() * numbers.length)
    ];
  }

  return code;
}


async function checkUser() {

  const {
    data: { user },
    error
  } = await sb.auth.getUser();

  if (error || !user) {

    window.location.href = "../login.html";
    return;

  }

  currentUser = user;

  loadClasses();
}


async function loadClasses() {

  const container = document.getElementById("classes");

  container.innerHTML =
    '<div class="empty">Сыныптар жүктелуде...</div>';

  const { data, error } = await sb
    .from("classes")
    .select("*")
    .order("created_at", {
      ascending: false
    });

  if (error) {

    console.error(error);

    container.innerHTML =
      '<div class="empty">Сыныптарды жүктеу кезінде қате шықты.</div>';

    showMessage(error.message);

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML = `
      <div class="empty">
        <h3>Әзірге сынып жоқ</h3>
        <p>
          «+ Сынып құру» батырмасын басып,
          бірінші сыныбыңызды жасаңыз.
        </p>
      </div>
    `;

    return;
  }


  container.innerHTML = "";


  data.forEach(item => {

    const card = document.createElement("div");

    card.className = "class-card";

    const title = document.createElement("h3");
    title.textContent = "🏫 " + (item.name || "Сынып");

    const subject = document.createElement("div");
    subject.className = "subject";
    subject.textContent =
      "Пән: " + (item.subject || "Көрсетілмеген");

    const codeBox = document.createElement("div");
    codeBox.className = "code-box";

    const codeLabel = document.createElement("div");
    codeLabel.textContent = "Оқушыға арналған код:";

    const code = document.createElement("div");
    code.className = "code";
    code.textContent = item.class_code || "—";

    codeBox.appendChild(codeLabel);
    codeBox.appendChild(code);

    card.appendChild(title);
    card.appendChild(subject);
    card.appendChild(codeBox);

    container.appendChild(card);

  });

}


async function createClass() {

  if (!currentUser) {
    showMessage("Пайдаланушы анықталмады.");
    return;
  }

  const name =
    document.getElementById("className").value.trim();

  const subject =
    document.getElementById("subject").value.trim();


  if (!name) {
    showMessage("Сынып атауын енгізіңіз.");
    return;
  }


  if (!subject) {
    showMessage("Пәнді енгізіңіз.");
    return;
  }


  const button =
    document.getElementById("saveClassBtn");

  button.disabled = true;
  button.textContent = "Сақталуда...";


  let created = false;


  for (let attempt = 0; attempt < 5; attempt++) {

    const classCode = generateClassCode();

    const { error } = await sb
      .from("classes")
      .insert({
        teacher_id: currentUser.id,
        name: name,
        subject: subject,
        class_code: classCode
      });


    if (!error) {

      created = true;
      break;

    }


    /*
      Егер class_code UNIQUE болса және кездейсоқ
      код қайталанса, жаңа код жасап тағы көреміз.
    */

    if (error.code !== "23505") {

      console.error(error);

      showMessage(
        "Сыныпты құру мүмкін болмады: " +
        error.message
      );

      button.disabled = false;
      button.textContent = "Сынып құру";

      return;
    }

  }


  button.disabled = false;
  button.textContent = "Сынып құру";


  if (!created) {

    showMessage(
      "Бірегей сынып кодын жасау мүмкін болмады. Қайта көріңіз."
    );

    return;
  }


  document.getElementById("className").value = "";
  document.getElementById("subject").value = "";

  closeModal();

  showMessage(
    "Сынып сәтті құрылды!",
    "success"
  );

  await loadClasses();

}


document
  .getElementById("modal")
  .addEventListener("click", function(event) {

    if (event.target === this) {
      closeModal();
    }

  });


checkUser();

</script>

</body>
</html>
