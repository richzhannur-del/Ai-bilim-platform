<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Менің сыныптарым | AI-BILIM</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
/* ===== AI-BILIM CLASS CARDS NEW DESIGN ===== */

.classes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
  gap: 24px;
  margin-top: 25px;
}

.class-card {
  position: relative;
  background: linear-gradient(145deg, #ffffff 0%, #fffaf2 100%);
  border: 1px solid #eadfcf;
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  overflow: hidden;
}

.class-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 6px;
  height: 100%;
  background: linear-gradient(#b7791f, #07875f);
}

.class-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 18px 38px rgba(15, 23, 42, 0.12);
}

.class-card h3 {
  margin: 0 0 12px;
  color: #102342;
  font-size: 24px;
  font-weight: 800;
}

.subject {
  display: inline-block;
  color: #8a5a18;
  background: #fff3dc;
  padding: 7px 12px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
}

.code-box {
  margin-top: 22px;
  padding: 16px 18px;
  background: #f4f8f6;
  border: 1px dashed #9bc7b7;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.code-box span {
  color: #64748b;
  font-size: 13px;
}

.code-box strong {
  color: #08785b;
  font-size: 20px;
  letter-spacing: 2px;
}

.class-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.copy-code-btn,
.open-class-btn {
  border: none;
  border-radius: 12px;
  padding: 12px 16px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s ease;
}

.copy-code-btn {
  flex: 1;
  background: #f3eadc;
  color: #87591c;
}

.copy-code-btn:hover {
  background: #ead7b9;
}

.open-class-btn {
  flex: 1;
  background: #087f60;
  color: white;
}

.open-class-btn:hover {
  background: #05694f;
  transform: translateY(-1px);
}

@media (max-width: 650px) {
  .classes {
    grid-template-columns: 1fr;
  }

  .class-card {
    padding: 22px;
  }

  .class-actions {
    flex-direction: column;
  }

  .copy-code-btn,
  .open-class-btn {
    width: 100%;
  }
}
  </style>
</head>

<body>

<header>
  <div class="logo">AI-BILIM</div>
  <a href="dashboard.html" class="back">← Кабинетке қайту</a>
</header>

<main>

  <div class="top">
    <div>
      <h1>🏫 Менің сыныптарым</h1>
      <div class="subtitle">
        Сынып құрыңыз және оқушыларға қосылу кодын беріңіз.
      </div>
    </div>

    <button class="create-btn" onclick="openModal()">
      + Сынып құру
    </button>
  </div>

  <div id="message"></div>

  <div id="classes" class="classes">
    <div class="empty">Сыныптар жүктелуде...</div>
  </div>

</main>


<div id="modal" class="modal">

  <div class="modal-box">

    <h2>Жаңа сынып</h2>

    <label for="className">Сынып атауы</label>

    <input
      id="className"
      type="text"
      placeholder="Мысалы: 7 А"
    >

    <label for="subject">Пән</label>

    <input
      id="subject"
      type="text"
      placeholder="Мысалы: Информатика"
    >

    <div class="modal-buttons">

      <button
        class="cancel-btn"
        onclick="closeModal()"
      >
        Болдырмау
      </button>

      <button
        id="saveClassBtn"
        class="save-btn"
        onclick="createClass()"
      >
        Сынып құру
      </button>

    </div>

  </div>

</div>


<script src="../js/config.js"></script>

<script>

let currentUser = null;


function openModal() {
  document.getElementById("modal").classList.add("active");
}


function closeModal() {
  document.getElementById("modal").classList.remove("active");
}


function showMessage(text, type = "error") {

  const box = document.getElementById("message");

  box.textContent = text;
  box.className = type;

}


function generateClassCode() {

  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const numbers = "23456789";

  let code = "";

  for (let i = 0; i < 3; i++) {
    code += letters[
      Math.floor(Math.random() * letters.length)
    ];
  }

  code += "-";

  for (let i = 0; i < 4; i++) {
    code += numbers[
      Math.floor(Math.random() * numbers.length)
    ];
  }

  return code;
}


async function checkUser() {

  const {
    data: { user },
    error
  } = await sb.auth.getUser();

  if (error || !user) {

    window.location.href = "../login.html";
    return;

  }

  currentUser = user;

  loadClasses();
}


async function loadClasses() {

  const container = document.getElementById("classes");

  container.innerHTML =
    '<div class="empty">Сыныптар жүктелуде...</div>';

  const { data, error } = await sb
    .from("classes")
    .select("*")
    .order("created_at", {
      ascending: false
    });

  if (error) {

    console.error(error);

    container.innerHTML =
      '<div class="empty">Сыныптарды жүктеу кезінде қате шықты.</div>';

    showMessage(error.message);

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML = `
      <div class="empty">
        <h3>Әзірге сынып жоқ</h3>
        <p>
          «+ Сынып құру» батырмасын басып,
          бірінші сыныбыңызды жасаңыз.
        </p>
      </div>
    `;

    return;
  }


  container.innerHTML = "";


data.forEach(item => {

  const card = document.createElement("div");
  card.className = "class-card";

  // Сынып атауы
  const title = document.createElement("h3");
  title.textContent = "🏫 " + (item.name || "Сынып");

  // Пән
  const subject = document.createElement("div");
  subject.className = "subject";
  subject.textContent = "📚 " + (item.subject || "Пән көрсетілмеген");

  // Код
  const codeBox = document.createElement("div");
  codeBox.className = "code-box";

  const codeLabel = document.createElement("span");
  codeLabel.textContent = "Қосылу коды";

  const code = document.createElement("strong");
  code.textContent = item.class_code || "—";

  codeBox.appendChild(codeLabel);
  codeBox.appendChild(code);

  // Төменгі батырмалар
  const actions = document.createElement("div");
  actions.className = "class-actions";

  const openBtn = document.createElement("button");
  openBtn.className = "open-class-btn";
  openBtn.textContent = "Сыныпты ашу →";

  openBtn.addEventListener("click", () => {
    window.location.href =
      "class.html?id=" + encodeURIComponent(item.id);
  });

  const copyBtn = document.createElement("button");
  copyBtn.className = "copy-code-btn";
  copyBtn.textContent = "📋 Кодты көшіру";

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(item.class_code || "");
      copyBtn.textContent = "✓ Көшірілді";

      setTimeout(() => {
        copyBtn.textContent = "📋 Кодты көшіру";
      }, 1500);
    } catch (error) {
      console.error(error);
    }
  });

  actions.appendChild(copyBtn);
  actions.appendChild(openBtn);

  card.appendChild(title);
  card.appendChild(subject);
  card.appendChild(codeBox);
  card.appendChild(actions);

  container.appendChild(card);

});

}


async function createClass() {

  if (!currentUser) {
    showMessage("Пайдаланушы анықталмады.");
    return;
  }

  const name =
    document.getElementById("className").value.trim();

  const subject =
    document.getElementById("subject").value.trim();


  if (!name) {
    showMessage("Сынып атауын енгізіңіз.");
    return;
  }


  if (!subject) {
    showMessage("Пәнді енгізіңіз.");
    return;
  }


  const button =
    document.getElementById("saveClassBtn");

  button.disabled = true;
  button.textContent = "Сақталуда...";


  let created = false;


  for (let attempt = 0; attempt < 5; attempt++) {

    const classCode = generateClassCode();

    const { error } = await sb
      .from("classes")
      .insert({
        teacher_id: currentUser.id,
        name: name,
        subject: subject,
        class_code: classCode
      });


    if (!error) {

      created = true;
      break;

    }


    /*
      Егер class_code UNIQUE болса және кездейсоқ
      код қайталанса, жаңа код жасап тағы көреміз.
    */

    if (error.code !== "23505") {

      console.error(error);

      showMessage(
        "Сыныпты құру мүмкін болмады: " +
        error.message
      );

      button.disabled = false;
      button.textContent = "Сынып құру";

      return;
    }

  }


  button.disabled = false;
  button.textContent = "Сынып құру";


  if (!created) {

    showMessage(
      "Бірегей сынып кодын жасау мүмкін болмады. Қайта көріңіз."
    );

    return;
  }


  document.getElementById("className").value = "";
  document.getElementById("subject").value = "";

  closeModal();

  showMessage(
    "Сынып сәтті құрылды!",
    "success"
  );

  await loadClasses();

}


document
  .getElementById("modal")
  .addEventListener("click", function(event) {

    if (event.target === this) {
      closeModal();
    }

  });


checkUser();

</script>

</body>
</html>
